# Builds the native core on every platform, tests it, and publishes the
# addon when a version tag (v1.2.3) is pushed.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # an older glibc, so the library runs on more systems
            platform: linux
            arch: x86_64
          - name: windows-x86_64
            os: windows-latest
            platform: windows
            arch: x86_64
          - name: macos-universal
            os: macos-latest
            platform: macos
            arch: universal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install scons

      # godot-cpp's bindings take minutes to compile; keep them between runs.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: addons/nconsole/native/.scons-cache
          key: scons-${{ matrix.name }}-${{ hashFiles('.gitmodules', 'addons/nconsole/native/SConstruct') }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.name }}-${{ hashFiles('.gitmodules', 'addons/nconsole/native/SConstruct') }}-
            scons-${{ matrix.name }}-

      - name: Build debug and release
        working-directory: addons/nconsole/native
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/addons/nconsole/native/.scons-cache
        run: |
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug -j4
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release -j4

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: addons/nconsole/bin/
          if-no-files-found: error

  test:
    name: Test on Linux
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-x86_64
          path: addons/nconsole/bin/

      - name: Get Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          ./godot --version

      - name: Import the project
        run: ./godot --headless --import

      - name: Run the tests
        run: ./godot --headless --path . -s addons/nconsole/tests/run_tests.gd

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: addons/nconsole/bin/

      - name: Package the addon
        run: |
          mkdir -p dist/addons
          rsync -a --exclude native --exclude tests addons/nconsole dist/addons/
          cp LICENSE CREDITS.md dist/addons/nconsole/
          (cd dist && zip -qr "../nconsole-${GITHUB_REF_NAME}.zip" addons)
          unzip -l "nconsole-${GITHUB_REF_NAME}.zip" | tail -n 25

      - uses: softprops/action-gh-release@v2
        with:
          files: nconsole-*.zip
          generate_release_notes: true
